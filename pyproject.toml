[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-ci-failure-correlator"
version = "0.7.0"
description = "Normalize and correlate recurring CI failures across repositories."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
  { name = "agent-ci-failure-correlator contributors" }
]
keywords = ["ci", "devops", "github-actions", "pytest", "npm", "codex", "claude-code", "triage"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
agent-ci-failure-correlator = "agent_ci_failure_correlator.cli:main"

[project.urls]
Homepage = "https://github.com/yanqr213/agent-ci-failure-correlator"
Repository = "https://github.com/yanqr213/agent-ci-failure-correlator"
Issues = "https://github.com/yanqr213/agent-ci-failure-correlator/issues"

[tool.setuptools.packages.find]
include = ["agent_ci_failure_correlator*"]
