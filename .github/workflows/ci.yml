name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e .

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run sample analysis
        run: |
          python -m agent_ci_failure_correlator fetch-github --help
          python -m agent_ci_failure_correlator analyze examples/inputs --format json --output report.json
          python -m agent_ci_failure_correlator analyze examples/inputs --format brief --output report-brief.md
          python -m agent_ci_failure_correlator analyze examples/inputs --format queue --output repair-queue.md --max-tasks 3
          python -m agent_ci_failure_correlator analyze examples/inputs --format queue-json --output repair-queue.json --max-tasks 3
          python -m agent_ci_failure_correlator analyze examples/inputs --format markdown --output report.md
          python -m agent_ci_failure_correlator analyze examples/inputs --format sarif --output report.sarif
          python -m json.tool repair-queue.json > /dev/null
          python -m json.tool report.sarif > /dev/null
          python -m agent_ci_failure_correlator analyze report.json --format brief --output report-roundtrip-brief.md
